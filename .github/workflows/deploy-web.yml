name: Deploy Web (Cloud Foundry)

# Deploys the Next.js web app to SAP BTP Cloud Foundry using deploy.sh.
# - Automatic deploy to `dev` on every push to main.
# - Manual deploy to any environment via the "Run workflow" button.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, qual, prod]
        default: dev
  push:
    branches: [main]

concurrency:
  group: deploy-web-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy → ${{ github.event.inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    # Map to a GitHub Environment so you can scope secrets / approvals per stage.
    environment: ${{ github.event.inputs.environment || 'dev' }}
    env:
      TARGET_ENV: ${{ github.event.inputs.environment || 'dev' }}
      # ── CF authentication (non-interactive) ──
      CF_USERNAME: ${{ secrets.CF_USERNAME }}
      CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
      CF_ORIGIN: ${{ secrets.CF_ORIGIN }}
      # ── App secrets consumed by deploy.sh ──
      CF_APP_URL: ${{ secrets.CF_APP_URL }}
      CF_DB_SERVICE_NAME: ${{ secrets.CF_DB_SERVICE_NAME }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
      GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      # NEXT_PUBLIC_* are baked into the client bundle at build time and are
      # what the native apps use for Google Sign-In against this web app.
      NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      NEXT_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Cloud Foundry CLI v8
        run: |
          wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/cli.cloudfoundry.org.gpg
          echo "deb [signed-by=/usr/share/keyrings/cli.cloudfoundry.org.gpg] https://packages.cloudfoundry.org/debian stable main" \
            | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
          sudo apt-get update
          sudo apt-get install -y cf8-cli
          cf version

      - name: Deploy
        run: |
          chmod +x deploy.sh
          ./deploy.sh "$TARGET_ENV"
