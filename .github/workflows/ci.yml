name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Type-check · Build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Prisma only needs a syntactically valid URL to generate the client;
      # no real database is contacted during lint/type-check/build.
      DATABASE_URL: 'postgresql://user:pass@localhost:5432/db?schema=public'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint (advisory)
        # Non-blocking for now: the existing codebase has pre-existing lint
        # violations. Type-check and build below are the hard gates. Flip this
        # to a hard failure once the backlog is cleaned up.
        continue-on-error: true
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Build (Next.js standalone)
        run: npm run build
