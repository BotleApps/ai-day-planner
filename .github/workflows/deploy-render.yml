name: Deploy to Render

# Deploys the Next.js web app to Render.
# Render auto-deploys on every push to main via the render.yaml Blueprint.
# This workflow:
#   - Gates the deploy on CI (lint, types, tests, build, audit, CodeQL passing).
#   - Pings Render's Deploy Hook so each deploy is tracked in Actions.
#   - Polls health-check after deploy and fails the action if the new revision
#     doesn't come up healthy.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this manual deploy?
        required: false
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "ios/**"
      - "android/**"
      - "mobile/**"
      - "capacitor.config.ts"
      - ".github/workflows/build-ios.yml"
      - ".github/workflows/build-android.yml"

concurrency:
  group: deploy-render-main
  cancel-in-progress: false

jobs:
  # 1. Re-run CI gates on this exact commit. Failure here aborts the deploy.
  gate:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Trigger Render deploy
    runs-on: ubuntu-latest
    needs: gate
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.RENDER_APP_URL }}
    steps:
      - name: Trigger Render Deploy Hook
        # Render exposes a Deploy Hook URL per service in the dashboard:
        # https://api.render.com/deploy/srv-XXXX?key=YYYY
        # Store this entire URL as the `RENDER_DEPLOY_HOOK_URL` repo secret.
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set."
            exit 1
          fi
          RESPONSE=$(curl -fsS -X POST "$HOOK")
          echo "$RESPONSE"
          DEPLOY_ID=$(echo "$RESPONSE" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("deploy", {}).get("id", ""))' 2>/dev/null || echo "")
          echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for Render deploy to come up
        env:
          APP_URL: ${{ vars.RENDER_APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::warning::RENDER_APP_URL variable not set — skipping health check."
            exit 0
          fi
          echo "Polling $APP_URL/api/health for up to 8 minutes..."
          for i in $(seq 1 48); do
            sleep 10
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL/api/health" || echo "000")
            echo "  attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "::notice::New deploy is healthy."
              exit 0
            fi
          done
          echo "::error::Deploy did not reach a healthy state within the window."
          exit 1
