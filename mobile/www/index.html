<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SortedPlan</title>
  <style>
    :root { color-scheme: light dark; }
    html, body {
      margin: 0; height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f23; color: #e2e8f0;
    }
    .wrap {
      height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      padding: 32px calc(24px + env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
    }
    .logo {
      width: 72px; height: 72px; border-radius: 20px; margin-bottom: 20px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      display: flex; align-items: center; justify-content: center; font-size: 36px;
    }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { font-size: 14px; line-height: 1.6; color: #94a3b8; max-width: 320px; margin: 0 0 6px; }
    code {
      font-family: ui-monospace, Menlo, monospace; font-size: 12.5px;
      background: #1e1e3f; padding: 3px 7px; border-radius: 6px; color: #c4b5fd;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">🗓️</div>
    <h1>SortedPlan</h1>
    <p>This native shell loads the deployed web app.</p>
    <p>Set <code>CAP_SERVER_URL</code> and run <code>npx cap sync</code> to point it at your environment.</p>
  </div>
</body>
</html>
