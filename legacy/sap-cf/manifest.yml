---
applications:
  - name: ai-day-planner
    memory: 512M
    disk_quota: 1024M
    instances: 1
    buildpacks:
      - nodejs_buildpack
    # Only upload the pre-built standalone output — not the whole project tree.
    # deploy.sh copies public/ and .next/static/ into here before pushing.
    path: .next/standalone
    command: node server.js
    health-check-type: http
    health-check-http-endpoint: /api/health
    env:
      NODE_ENV: production
      # Secrets are injected via 'cf set-env' in deploy.sh — do NOT commit values here.
      # Required variables:
      #   DATABASE_URL        — PostgreSQL connection string
      #   AUTH_SECRET         — Random secret (openssl rand -base64 32)
      #   NEXTAUTH_URL        — Full HTTPS URL of this CF app
      #   GOOGLE_CLIENT_ID    — Google OAuth client ID
      #   GOOGLE_CLIENT_SECRET — Google OAuth client secret
      #   ENCRYPTION_KEY      — 64-char hex string (node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
